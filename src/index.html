<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBS - Visionneuse de données de santé</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <div class="col-xs-12 text-center" style="padding: 20px 0;">
      <h1>WEBS <small>Visionneuse de données de santé</small></h1>
    </div>
  </div>
  <div class="row">
    <div class="col-xs-12">
      <div class="panel panel-primary">
        <div class="panel-heading"><strong>Paramètres</strong></div>
        <div class="panel-body">
          <div class="row">
            <div class="col-sm-3">
              <label>Patient 1</label>
              <select id="patient1-select" class="form-control">
                <option value="1">Patient 1</option>
                <option value="2">Patient 2</option>
                <option value="3">Patient 3</option>
                <option value="4">Patient 4</option>
                <option value="5">Patient 5</option>
                <option value="6">Patient 6</option>
                <option value="7">Patient 7</option>
                <option value="8">Patient 8</option>
                <option value="9">Patient 9</option>
                <option value="10">Patient 10</option>
              </select>
              <label style="margin-top:8px;">Activité patient 1</label>
              <select id="activity1-select" class="form-control">
                <option value="0">Debout immobile</option>
                <option value="1">Assis détendu</option>
                <option value="2">Allongé</option>
                <option value="3">Marche</option>
                <option value="4">Monter escaliers</option>
                <option value="5">Penché en avant</option>
                <option value="6">Élévation des bras</option>
                <option value="7">Flexion genoux</option>
                <option value="8">Vélo</option>
                <option value="9">Jogging</option>
                <option value="10">Course à pied</option>
                <option value="11">Saut avant/arrière</option>
              </select>
              <div style="margin-top:10px;">
                <button id="start-patient1" class="btn btn-success btn-sm">Démarrer</button>
                <button id="stop-patient1" class="btn btn-danger btn-sm">Arrêter</button>
              </div>
            </div>
            <div class="col-sm-3">
              <label>Patient 2</label>
              <select id="patient2-select" class="form-control">
                <option value="1">Patient 1</option>
                <option value="2">Patient 2</option>
                <option value="3">Patient 3</option>
                <option value="4">Patient 4</option>
                <option value="5">Patient 5</option>
                <option value="6">Patient 6</option>
                <option value="7">Patient 7</option>
                <option value="8">Patient 8</option>
                <option value="9">Patient 9</option>
                <option value="10">Patient 10</option>
              </select>
              <label style="margin-top:8px;">Activité patient 2</label>
              <select id="activity2-select" class="form-control">
                <option value="0">Debout immobile</option>
                <option value="1">Assis détendu</option>
                <option value="2">Allongé</option>
                <option value="3">Marche</option>
                <option value="4">Monter escaliers</option>
                <option value="5">Penché en avant</option>
                <option value="6">Élévation des bras</option>
                <option value="7">Flexion genoux</option>
                <option value="8">Vélo</option>
                <option value="9">Jogging</option>
                <option value="10">Course à pied</option>
                <option value="11">Saut avant/arrière</option>
              </select>
              <div style="margin-top:10px;">
                <button id="start-patient2" class="btn btn-success btn-sm">Démarrer</button>
                <button id="stop-patient2" class="btn btn-danger btn-sm">Arrêter</button>
              </div>
            </div>
            <div class="col-sm-3">
              <label>Capteurs affichés</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="alx" checked> alx</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="aly" checked> aly</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="alz" checked> alz</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="glx" checked> glx</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="gly" checked> gly</label><br>
              <label class="checkbox-inline"><input type="checkbox" class="sensor-checkbox" data-sensor="glz" checked> glz</label>
            </div>
            <div class="col-sm-3">
              <label>Taux de rafraîchissement</label>
              <input type="range" id="refresh-slider" min="100" max="2000" value="500" step="100" class="form-control">
              <p class="text-center"><strong id="refresh-value">500 ms</strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-6">
      <div class="panel panel-default">
        <div class="panel-heading"><strong>Patient 1</strong></div>
        <div class="panel-body">
          <canvas id="chart-patient1" height="120"></canvas>
        </div>
      </div>
    </div>
    <div class="col-sm-6">
      <div class="panel panel-default">
        <div class="panel-heading"><strong>Patient 2</strong></div>
        <div class="panel-body">
          <canvas id="chart-patient2" height="120"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
